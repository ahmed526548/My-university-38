<!DOCTYPE html>

  <script>
    // Register the offline app worker. It caches the app shell and public UI libraries.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
          .catch((error) => console.warn("تعذر تفعيل وضع عدم الاتصال:", error));
      });
    }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>بوابة جامعة بني سويف الأهلية | BSNU Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { cairo: ['Cairo', 'sans-serif'] },
          colors: {
            uni: {
              50: '#ecfeff', 100: '#cffafe', 200: '#a5f3fc', 300: '#67e8f9',
              400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490',
              800: '#155e75', 900: '#164e63', 950: '#083344'
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.35s ease-out',
            'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            pulseSoft: { '0%, 100%': { opacity: '0.4' }, '50%': { opacity: '0.8' } },
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Cairo', sans-serif; background: #07101f; margin: 0; overflow-x: hidden; color: #e5edf7; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #07151d; }
    ::-webkit-scrollbar-thumb { background: #155e75; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #0e7490; }
    .glass { background: linear-gradient(145deg, rgba(22, 39, 62, .76), rgba(10, 23, 42, .68)); border: 1px solid rgba(186, 220, 255, .10); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .glass-strong { background: rgba(8, 18, 34, .88); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
    .soft-panel { background: linear-gradient(145deg, rgba(24, 43, 68, .78), rgba(10, 23, 42, .72)); border: 1px solid rgba(186, 220, 255, .12); box-shadow: 0 14px 38px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255,255,255,.035); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .soft-surface { background: rgba(15, 31, 52, .68); border: 1px solid rgba(170, 211, 245, .09); }
    .soft-control { background: rgba(7, 19, 36, .72); border: 1px solid rgba(125, 190, 225, .18); transition: border-color .22s ease, background .22s ease, box-shadow .22s ease; }
    .soft-control:focus { outline: none; border-color: rgba(125, 211, 252, .58); box-shadow: 0 0 0 3px rgba(56, 189, 248, .08); }
    .soft-nav-shell { background: rgba(7, 17, 32, .84); border: 1px solid rgba(186, 220, 255, .12); box-shadow: 0 12px 40px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.05); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .soft-nav-item { min-width: 58px; transition: color .22s ease, background .22s ease, transform .22s ease; }
    .soft-nav-item[aria-current="page"] { color: #bae6fd; background: rgba(56,189,248,.11); box-shadow: inset 0 0 0 1px rgba(125,211,252,.13); }
    .soft-nav-item:active { transform: scale(.95); }
    .soft-chat-user { background: linear-gradient(135deg, rgba(14,116,144,.88), rgba(8,82,111,.84)); border: 1px solid rgba(125,211,252,.18); }
    .soft-chat-assistant { background: rgba(19, 35, 57, .78); border: 1px solid rgba(186,220,255,.11); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .soft-page { background: radial-gradient(ellipse at 50% -15%, rgba(56,189,248,.10), transparent 48%), linear-gradient(180deg,#091629 0%,#07101f 58%,#050c18 100%); }
    @keyframes softPageEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .portal-root > .min-h-screen { padding-bottom: max(7rem, calc(6rem + env(safe-area-inset-bottom))); animation: softPageEnter .32s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .portal-root > .min-h-screen { animation: none; } }
    .glow-cyan { box-shadow: 0 0 40px rgba(6, 182, 212, 0.15); }
    .glow-text { text-shadow: 0 0 30px rgba(34, 211, 238, 0.4); }
    .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-4px); border-color: rgba(34, 211, 238, 0.5); box-shadow: 0 12px 40px rgba(6, 182, 212, 0.12); }
    .message-enter { animation: slideUp 0.3s ease-out; }

    /* University welcome splash screen */
    @keyframes splashFadeOut {
      0%, 78% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; pointer-events: none; }
    }
    @keyframes splashMarkIn {
      0% { opacity: 0; transform: translateY(14px) scale(.82); }
      55% { opacity: 1; transform: translateY(-3px) scale(1.04); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes splashRing {
      0% { transform: scale(.82); opacity: .65; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes splashProgress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .splash-screen {
      animation: splashFadeOut 2.35s ease-in-out forwards;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(8,145,178,.22), transparent 42%),
        linear-gradient(160deg, #071923 0%, #030c13 58%, #02070b 100%);
    }
    .splash-mark { animation: splashMarkIn .85s .12s cubic-bezier(.2,.7,.2,1) both; }
    .splash-ring { animation: splashRing 1.8s .35s ease-out infinite; }
    .splash-progress { transform-origin: right; animation: splashProgress 1.85s .25s ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .splash-screen { animation-duration: .8s; }
      .splash-mark { animation-duration: .01ms; }
      .splash-ring { animation: none; }
      .splash-progress { animation-duration: .5s; }
    }

    /* Smooth cyan motion system */
    @keyframes riseIn {
      from { opacity: 0; transform: translate3d(0, 18px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes softGlow {
      0%, 100% { box-shadow: 0 8px 28px rgba(6,182,212,0.08); }
      50% { box-shadow: 0 12px 38px rgba(6,182,212,0.18); }
    }
    .home-enter { animation: riseIn .65s cubic-bezier(.2,.7,.2,1) both; }
    .home-hero { animation: riseIn .75s .08s cubic-bezier(.2,.7,.2,1) both; }
    .home-stagger > * { animation: riseIn .55s cubic-bezier(.2,.7,.2,1) both; }
    .home-stagger > *:nth-child(1) { animation-delay: .08s; }
    .home-stagger > *:nth-child(2) { animation-delay: .16s; }
    .home-stagger > *:nth-child(3) { animation-delay: .24s; }
    .home-stagger > *:nth-child(4) { animation-delay: .32s; }
    .home-stagger > *:nth-child(5) { animation-delay: .40s; }
    .home-stagger > *:nth-child(6) { animation-delay: .48s; }
    .home-stagger > *:nth-child(7) { animation-delay: .56s; }
    .home-action {
      transition: transform .28s cubic-bezier(.2,.7,.2,1), border-color .28s ease,
        box-shadow .28s ease, background-color .28s ease;
      will-change: transform;
    }
    .home-action:active { transform: scale(.975); }
    .home-action:focus-visible, button:focus-visible {
      outline: 2px solid rgba(34,211,238,.8);
      outline-offset: 3px;
    }
    .nav-action { transition: color .2s ease, transform .2s ease, background-color .2s ease; }
    .nav-action:active { transform: scale(.92); }
    .glow-cyan { box-shadow: 0 10px 32px rgba(56,189,248,.10); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
    @keyframes bounce-dot {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    input, textarea, button { font-family: inherit; }
    .progress-ring { transition: stroke-dashoffset 0.6s ease; }
  
    /* Site-wide Premium Soft Glass refresh */
    :root { color-scheme: dark; --portal-sky: #7dd3fc; --portal-cyan: #67e8f9; }
    html, body, #root { min-height: 100%; background: #061321 !important; }
    body {
      color: #e7f4ff !important;
      background:
        radial-gradient(ellipse at 12% 4%, rgba(56,189,248,.16), transparent 34%),
        radial-gradient(ellipse at 88% 24%, rgba(34,211,238,.10), transparent 30%),
        linear-gradient(155deg, #071827 0%, #081321 52%, #030b14 100%) !important;
      background-attachment: fixed !important;
    }
    .glass, .glass-strong, .soft-panel, .soft-surface, .soft-nav-shell {
      background: linear-gradient(145deg, rgba(20,43,67,.82), rgba(7,22,39,.78)) !important;
      border: 1px solid rgba(125,211,252,.18) !important;
      box-shadow: 0 14px 38px rgba(0,0,0,.24), inset 0 1px 0 rgba(226,245,255,.06) !important;
      -webkit-backdrop-filter: blur(20px) saturate(135%) !important;
      backdrop-filter: blur(20px) saturate(135%) !important;
    }
    .soft-nav-shell { background: rgba(5,18,33,.90) !important; border-color: rgba(125,211,252,.22) !important; }
    .soft-nav-item[aria-current="page"] { color: #e0f2fe !important; background: rgba(56,189,248,.18) !important; }
    .home-action, .card-hover { transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease !important; }
    .home-action:hover, .card-hover:hover { border-color: rgba(125,211,252,.34) !important; box-shadow: 0 16px 42px rgba(2,132,199,.13) !important; }
    input, textarea, select, button { accent-color: #38bdf8; }
    input:focus, textarea:focus, select:focus { outline-color: rgba(56,189,248,.65) !important; }
    ::selection { background: rgba(56,189,248,.32); color: #f0f9ff; }
    @media (prefers-reduced-motion: no-preference) {
      .home-hero { animation: portalHeroIn .55s ease both; }
      @keyframes portalHeroIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }


    /* Clearly visible v2 visual refresh: brighter sky-glass surfaces */
    .portal-root {
      --ui-sky: #38bdf8;
      --ui-cyan: #22d3ee;
      background: #061526 !important;
    }

        radial-gradient(ellipse at 14% 0%, rgba(14,165,233,.23), transparent 38%),

    .portal-root .soft-panel,

    }

      border-color: rgba(103,232,249,.48) !important;

      box-shadow: 0 22px 60px rgba(2,132,199,.18), inset 0 1px 0 rgba(224,242,254,.16) !important;

    .portal-root [class*="bg-[#0a1a24]"],
    .portal-root [class*="bg-[#0b1b25]"],

      background: linear-gradient(135deg,rgba(18,54,82,.92),rgba(8,29,50,.94)) !important;

    }
    .portal-root .soft-control {
      background: rgba(3,18,34,.88) !important;

    }

      background: rgba(4,19,35,.96) !important;
      border-color: rgba(103,232,249,.42) !important;
      box-shadow: 0 12px 36px rgba(0,0,0,.46), 0 0 26px rgba(14,165,233,.13) !important;
    }
    .portal-root .soft-nav-item[aria-current="page"] {
      color: #e0f7ff !important;
      background: linear-gradient(145deg,rgba(14,165,233,.34),rgba(34,211,238,.16)) !important;
      box-shadow: inset 0 0 0 1px rgba(125,211,252,.42), 0 0 18px rgba(56,189,248,.14) !important;
    }
    .portal-root button:not(.soft-nav-item) {
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease, transform .2s ease !important;
    }
    .portal-root button:hover {
      border-color: rgba(125,211,252,.48);
    }

      transform: translateY(-3px) !important;
      box-shadow: 0 18px 42px rgba(2,132,199,.2) !important;
    }
    .portal-root h1, .portal-root h2, .portal-root h3 {
      text-shadow: 0 1px 18px rgba(56,189,248,.10);
    }
    .portal-root .glow-cyan {
      box-shadow: 0 0 34px rgba(56,189,248,.24) !important;
    }
    ::selection { background: rgba(56,189,248,.42); color: #f0faff; }


    /* Developer credit and tidy social links */
    .developer-footer { clear: both; }
    .developer-social-link {
      display:flex; width:42px; height:42px; align-items:center; justify-content:center;
      border:1px solid var(--portal-accent-border,rgba(125,211,252,.3));
      border-radius:14px; color:var(--portal-accent,#7dd3fc);
      background:var(--portal-accent-soft,rgba(56,189,248,.10));
      transition:transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .developer-social-link:hover { transform:translateY(-2px); background:var(--portal-accent-soft); border-color:var(--portal-accent); }
    .developer-social-link:focus-visible { outline:2px solid var(--portal-accent); outline-offset:3px; }
    @media (max-width:420px) {
      .developer-footer { padding-left:12px; padding-right:12px; }
      .developer-social-link { width:40px; height:40px; }
    }

Use the links below to open the full summary and extracted slide text.`,
          externalLinks: [
            { label: 'عرض الملخص داخل الموقع', url: 'https://raw.githubusercontent.com/ahmed526548/My-university-38/main/lectures/Electronics/Electronics-Section-4-Summary.md', content: "# Electronics – Section 4\n## ملخص وشرح المحاضرة\n\n### 1) المقاومة الكهربائية (Resistance)\nالمقاومة خاصية المادة التي تعارض مرور التيار الكهربائي، ورمزها R ووحدتها الأوم (Ω).\n\nمقاومة مادة منتظمة المقطع:\n`R = ρℓ/A`\n\n- ρ: المقاومية النوعية (Ω·m)\n- ℓ: الطول (m)\n- A: مساحة المقطع (m²)\n\nزيادة طول المادة تزيد مقاومتها، وزيادة مساحة المقطع تقلل مقاومتها.\n\n### 2) قانون أوم (Ohm’s Law)\n`V = IR`\nومنها: `I = V/R` و `R = V/I`.\n\nمثال: مقاومة 4 Ω موصلة بجهد 12 V:\n`I = 12/4 = 3 A`.\n\n### 3) اتفاقية الإشارة (Passive Sign Convention)\nإذا دخل التيار إلى الطرف الموجب للمقاومة وخرج من الطرف السالب: `V = IR`.\nإذا كانت مراجع اتجاه التيار وقطبية الجهد متعاكسة وفق تعريف المسألة: `V = -IR`.\nحدد الاتجاه والقطبية أولًا والتزم بهما.\n\n### 4) أنواع المقاومات\n- Fixed Resistor: مقاومة ثابتة.\n- Variable Resistor: مقاومة يمكن تغيير قيمتها.\n\n### 5) التوصيلية (Conductance)\nمقلوب المقاومة، ورمزها G:\n`G = 1/R`\nوحدتها السيمنز (S)، ويُستخدم أيضًا mho.\n\nمثال: إذا كانت R = 5 Ω فإن G = 0.2 S.\n\n### 6) العقد والفروع والحلقات\n- Node: نقطة اتصال فرعين أو أكثر.\n- Branch: جزء يحتوي عنصرًا واحدًا مثل مقاومة أو مصدر جهد.\n- Loop: مسار مغلق يبدأ وينتهي عند النقطة نفسها.\n\n### 7) التوالي والتوازي\n**التوالي (Series):** التيار نفسه يمر في العناصر:\n`Req = R1 + R2 + ...`\n\n**التوازي (Parallel):** الجهد نفسه على العناصر:\n`1/Req = 1/R1 + 1/R2 + ...`\nولمقاومتين:\n`Req = (R1 × R2)/(R1 + R2)`\n\nمثال: 2 Ω و3 Ω:\n- توالي: 5 Ω\n- توازي: 1.2 Ω\n\n### 8) قانون كيرشوف للتيار (KCL)\nمجموع التيارات الداخلة إلى أي عقدة يساوي مجموع التيارات الخارجة:\n`ΣI(in) = ΣI(out)`.\n\n### 9) قانون كيرشوف للجهد (KVL)\nالمجموع الجبري لفروق الجهد حول أي مسار مغلق يساوي صفرًا:\n`ΣV = 0`.\n\n### خطوات حل مسائل الدوائر\n1. اقرأ الرسم وحدد العناصر والقيم واتجاهات التيار وقطبية الجهد.\n2. استخدم قانون أوم عند الحاجة.\n3. استخدم KCL لحساب التيارات عند العقد.\n4. استخدم KVL لحساب الجهود حول الحلقات.\n5. التزم باتفاقية الإشارات.\n6. راجع الوحدات: V للجهد، A للتيار، Ω للمقاومة، وS للتوصيلية.\n\n### ورقة القوانين السريعة\n- `V = IR`\n- `I = V/R`\n- `R = V/I`\n- `R = ρℓ/A`\n- `G = 1/R`\n- `Req(series) = R1 + R2 + ...`\n- `Req(parallel) = (R1R2)/(R1+R2)` لمقاومتين\n- `ΣI(in) = ΣI(out)`\n- `ΣV = 0`\n\n> ملاحظة: هذا ملف نصي مستخرج ومنسق من ملف الشرح المرفوع، وليس نسخة DOCX الأصلية.\n" },
            { label: 'عرض نص الشرائح داخل الموقع', url: 'https://raw.githubusercontent.com/ahmed526548/My-university-38/main/lectures/Electronics/Electronics-Section-4-Slides-Text-Extract.md', content: "# Electronics – Section 4 (Lecture Slides: extracted text)\n**TA: SALMA SAEED**\n\n## Topics covered\n- Ohm’s Law\n- Resistance and resistivity\n- Passive sign convention\n- Fixed and variable resistors\n- Conductance\n- Nodes, branches, and loops\n- Series and parallel connections\n- Kirchhoff’s Current Law (KCL)\n- Kirchhoff’s Voltage Law (KVL)\n- Worked examples\n- Assignment 2 and Assignment 3\n\n## Extracted lecture text\n\n### Ohm’s Law\nMaterials resist the flow of electric charge. This property is called resistance and is represented by R. The resistance of a uniform material depends on its cross-sectional area A, length ℓ, and resistivity ρ. Copper and aluminum have low resistivity; mica and paper have high resistivity.\n\nThe circuit element used to model resistance is the resistor.\n\n### Passive sign convention\nThe current direction and voltage polarity must follow the passive sign convention:\n- If current flows from higher potential to lower potential: v = iR.\n- If current flows from lower potential to higher potential: v = −iR.\n\n### Resistors\nA resistor may be fixed or variable. Most resistors are fixed, meaning their resistance remains constant.\n\n### Conductance\nConductance G is the reciprocal of resistance and measures how well an element conducts electric current. Units include mho (℧) and siemens (S).\n\n### Nodes, branches, and loops\n- A branch represents a single element such as a voltage source or resistor.\n- A node is the connection point between two or more branches.\n- A loop is any closed path in a circuit.\n- Series elements share a single node and carry the same current.\n- Parallel elements connect to the same two nodes and have the same voltage.\n\n### Kirchhoff’s laws\nThe slides include sections on Kirchhoff’s Current Law and Kirchhoff’s Voltage Law, followed by worked examples.\n\n### Assignments\nThe presentation includes Assignment 2 (Problems 1–4) and Assignment 3 (Problems 5–6).\n\nAssignment form: https://forms.gle/V3FFcc421KS3ZTtk8\n\n> Important: This is the text extract of the PowerPoint. Diagrams, circuit images, and some numerical details from slide images are not represented here. The original PPTX binary could not be transferred from the available file workspace.\n" }

        let active = true;

        const timeoutId = setTimeout(() => {
          if (active && !settled) {
            setStudentAuthError('استغرق التحقق وقتًا أطول من المعتاد. حدّث الصفحة وحاول مرة أخرى.');
            setStudentAuthLoading(false);
          }
        }, 10000);
        const { data: listener } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (!active) return;
          setStudentSession(session || null);
          if (event === 'PASSWORD_RECOVERY') {
            setStudentEmail(session?.user?.email || '');
            setStudentAuthMode('update');
            setStudentAuthMessage('اكتب كلمة المرور الجديدة لحسابك.');
          }
          if (event === 'SIGNED_IN' && session?.user && !session.user.is_anonymous) {
            const key = studentSessionKey(session.user.id);
            if (!localStorage.getItem(key)) localStorage.setItem(key, String(Date.now()));
          }
          if (event === 'INITIAL_SESSION') {
            settled = true;
            clearTimeout(timeoutId);
            if (session?.user) setStudentAuthError('');
          }
        });
        (async () => {
          try {
            const { data, error } = await supabaseClient.auth.getSession();
            if (!active) return;
            settled = true;
            clearTimeout(timeoutId);
            if (error) setStudentAuthError(error.message || 'تعذر استعادة جلسة الدخول');
            let restoredSession = data?.session || null;
            const restoredUser = restoredSession?.user;
            if (restoredUser?.id && !restoredUser.is_anonymous) {
              const key = studentSessionKey(restoredUser.id);
              const startedAt = Number(localStorage.getItem(key));
              if (!startedAt) {
                localStorage.setItem(key, String(Date.now()));

      const setView = (nextView) => {

        const stack = viewHistoryRef.current;
        if (!isHandlingPopRef.current && stack.length > 1 && stack[stack.length - 2] === target) {
          window.history.back();
          return;
        }

        if (!isHandlingPopRef.current) {

        setAdminBusy(false);
        if (error) { showToast('تعذر تسجيل الخروج', 'error'); return; }
        setAdminSession(null); setAdminAllowed(false); setView('settings');
        showToast('تم تسجيل الخروج');
      };

      const loadAdminRecords = async (table = adminSelectedTable) => {
        if (!supabaseClient || !adminAllowed || !adminSession) return;
        setAdminDataBusy(true);
        const { data, error } = await supabaseClient.from(table).select('*').limit(150);
        setAdminDataBusy(false);
        if (error) { showToast('تعذر تحميل البيانات: ' + error.message, 'error'); return; }
        setAdminRecords(data || []);
      };

      const saveAdminRecord = async (event) => {
        event.preventDefault();
        if (!adminAllowed || !adminSession) return;
        const payload = {};
        for (const field of adminFieldConfig[adminSelectedTable]) {
          const value = adminFormData[field.key];
          if (value === undefined || value === null || value === '') continue;
          payload[field.key] = field.type === 'number' ? Number(value) : field.type === 'boolean' ? value === 'true' : field.type === 'datetime-local' ? new Date(value).toISOString() : value;
        }
        if (adminSelectedTable === 'lectures' && payload.file_url) payload.has_content = true;
        if (['student_tasks','portal_notifications'].includes(adminSelectedTable) && adminEditingId === null) payload.created_by = adminSession.user.id;
        const missingField = adminFieldConfig[adminSelectedTable].find(field => field.required && (payload[field.key] === undefined || payload[field.key] === ''));
        if (missingField) { showToast('من فضلك اكتب: ' + missingField.label, 'error'); return; }
        setAdminDataBusy(true);
        let result;
        if (adminEditingId !== null) {
          const { id, created_at, ...editableFields } = payload;
          result = await supabaseClient.from(adminSelectedTable).update(editableFields).eq(adminSelectedTable === 'student_profiles' ? 'user_id' : 'id', adminEditingId);
        } else {
          result = await supabaseClient.from(adminSelectedTable).insert(payload);
        }
        setAdminDataBusy(false);
        if (result.error) { showToast('لم يتم الحفظ: ' + result.error.message, 'error'); return; }
        try { await supabaseClient.from('portal_activity_log').insert({ actor_id: adminSession.user.id, action: adminEditingId !== null ? 'update' : 'create', entity: adminSelectedTable, details: { section: adminSelectedTable } }); } catch (_) {}
        setAdminFormData({}); setAdminEditingId(null);
        showToast(adminEditingId !== null ? 'تم تحديث السجل' : 'تمت إضافة السجل');
        await loadAdminRecords(adminSelectedTable);
      };

      const editAdminRecord = (record) => {
        const recordKey = record?.id ?? record?.user_id;
        if (recordKey === undefined || recordKey === null) {
          showToast('هذا السجل لا يحتوي على معرّف', 'error'); return;
        }
        setAdminEditingId(recordKey);
        const values = {};
        adminFieldConfig[adminSelectedTable].forEach(field => {
          const value = record[field.key];
          values[field.key] = field.type === 'boolean' ? String(Boolean(value)) : field.type === 'datetime-local' && value ? new Date(value).toISOString().slice(0,16) : value === null || value === undefined ? '' : String(value);
        });
        setAdminFormData(values);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const deleteAdminRecord = async (record) => {
        if (!adminAllowed || !adminSession || record?.id === undefined || record?.id === null) {
          showToast('لا يمكن حذف السجل لعدم وجود معرّف id', 'error'); return;
        }
        if (adminSelectedTable === 'student_profiles') { showToast('تعديل بيانات الطالب متاح، حذف الحساب يتم من إدارة المستخدمين في Supabase.', 'error'); return; }
        if (!window.confirm('متأكد إنك عايز تحذف السجل ده نهائيًا؟')) return;
        setAdminDataBusy(true);
        const { error } = await supabaseClient.from(adminSelectedTable).delete().eq('id', record.id);
        setAdminDataBusy(false);
        if (error) { showToast('تعذر الحذف: ' + error.message, 'error'); return; }
        try { await supabaseClient.from('portal_activity_log').insert({ actor_id: adminSession.user.id, action: 'delete', entity: adminSelectedTable, entity_id: String(record.id), details: { section: adminSelectedTable } }); } catch (_) {}
        showToast('تم حذف السجل');
        await loadAdminRecords(adminSelectedTable);
      };

      const loadAdminOverview = async () => {
        if (!adminAllowed || !adminSession) return;
        const countRows = async (table, filters = []) => {
          let query = supabaseClient.from(table).select('*', { count: 'exact', head: true });
          filters.forEach(([key, value]) => { query = query.eq(key, value); });
          const result = await query;
          return result.count || 0;
        };
        const [students, tasks, activityResult, viewsResult] = await Promise.all([
          countRows('student_profiles'), countRows('student_tasks'),
          supabaseClient.from('portal_activity_log').select('id,action,entity,created_at').order('created_at',{ascending:false}).limit(8),
          supabaseClient.from('lecture_views').select('lecture_id,lectures(title,subject_code)').limit(2000)
        ]);
        const groupedViews = {};
        (viewsResult.data || []).forEach(row => { const key=row.lecture_id; if(!groupedViews[key]) groupedViews[key]={ title:row.lectures?.title || 'محاضرة', subject:row.lectures?.subject_code || '', count:0 }; groupedViews[key].count++; });
        const topLectures = Object.values(groupedViews).sort((a,b)=>b.count-a.count).slice(0,5);
        setAdminOverview({ students, tasks, activity: activityResult.data || [], topLectures });
      };

      useEffect(() => {
        if (view === 'admin' && adminAllowed && adminSession) { loadAdminRecords(adminSelectedTable); loadAdminOverview(); }
      }, [view, adminAllowed, adminSession, adminSelectedTable]);

      // Skip the decorative splash so the portal is usable immediately.

      // Record lecture opens for the admin's usage analytics. Anonymous IDs are not shown in the dashboard.
      useEffect(() => {
        let active = true;
        const lectureId = preview?.lecture?.id;
        if (!preview?.open || typeof lectureId !== 'string' || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(lectureId)) return;
        (async () => {
          try {
            let { data } = await supabaseClient.auth.getSession();
            let session = data?.session;
            if (!session) {
              const result = await supabaseClient.auth.signInAnonymously();
              if (result.error) throw result.error;
              session = result.data?.session;
            }
            if (active && session?.user?.id) {
              const { error } = await supabaseClient.from('lecture_views').insert({ lecture_id: lectureId, viewer_id: session.user.id });
              if (error) console.warn('تعذر تسجيل مشاهدة المحاضرة:', error.message);
            }
          } catch (error) { console.warn('تعذر تسجيل مشاهدة المحاضرة:', error?.message); }
        })();
        return () => { active = false; };
      }, [preview?.open, preview?.lecture?.id]);

      // Persist
      useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 2800); return () => clearTimeout(t); } }, [toast]);
      useEffect(() => { localStorage.setItem('fav', JSON.stringify(favorites)); }, [favorites]);
      useEffect(() => { localStorage.setItem('completed', JSON.stringify(completed)); }, [completed]);
      useEffect(() => { localStorage.setItem('notes', JSON.stringify(notes)); }, [notes]);
      useEffect(() => { if (selectedGroup) localStorage.setItem('group', selectedGroup); }, [selectedGroup]);
      useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chat, typing]);

      // Timer state is isolated inside TimerView so its one-second updates never rerender the whole portal.

      const showToast = (msg, type = 'success') => setToast({ msg, type });

      const toggleFav = (code) => {
        setFavorites(prev => {
          const next = prev.includes(code) ? prev.filter(c => c !== code) : [...prev, code];
          showToast(prev.includes(code) ? 'تمت الإزالة من المفضلة' : 'تمت الإضافة للمفضلة ⭐');
          return next;
        });
      };

      const toggleComplete = (code, lecId) => {
        setCompleted(prev => {
          const key = `${code}-${lecId}`;
          const next = { ...prev };
          if (next[key]) delete next[key];
          else next[key] = true;
          showToast(next[key] ? 'تم تحديد المحاضرة كمكتملة ✅' : 'تم إلغاء الإكمال');
          return next;
        });
      };

      const isCompleted = (code, lecId) => !!completed[`${code}-${lecId}`];

      const getProgress = (code) => {
        const lec = allLecturesData[code] || allLecturesData.default;
        const ready = lec.filter(l => l.hasContent).length;
        const done = lec.filter(l => isCompleted(code, l.id)).length;
        return { total: lec.length, ready, done, percent: Math.round((ready / lec.length) * 100), donePercent: Math.round((done / Math.max(ready, 1)) * 100) };
      };

      const overallProgress = useMemo(() => {
        let totalReady = 0, totalDone = 0;
        subjectsData.forEach(s => {
          const p = getProgress(s.code);
          totalReady += p.ready;
          totalDone += p.done;
        });
        return { totalReady, totalDone, percent: totalReady ? Math.round((totalDone / totalReady) * 100) : 0 };
      }, [completed]);

      const today = getTodayArabic();
      const currentSchedule = selectedGroup === 'جروب 2' ? scheduleGroup2 : scheduleGroup1;
      const todaySch = currentSchedule.find(d => d.day === today);

      // Smart Bot
      const reply = useCallback((text) => {
        setTyping(true);
        const l = text.toLowerCase();
        let r = '';

        // Search in all lecture content
        let found = null;
        for (const [code, lecs] of Object.entries(allLecturesData)) {
          if (code === 'default') continue;
          for (const lec of lecs) {
            if (lec.hasContent && (lec.title.includes(text) || lec.summaryAr.includes(text) || lec.summaryEn.toLowerCase().includes(l) ||
              (l.includes('أنظمة') && lec.title.includes('Number')) ||
              (l.includes('hardware') || l.includes('هاردوير') || l.includes('مكونات')) && lec.title.includes('Hardware') ||
              (l.includes('software') || l.includes('برمج')) && lec.title.includes('Software') ||
              (l.includes('شبكة') || l.includes('network')) && lec.title.includes('Network') ||
              (l.includes('أمن') || l.includes('security')) && lec.title.includes('Security') ||
              (l.includes('تفاضل') || l.includes('derivative')) && lec.title.includes('تفاضل') ||
              (l.includes('إلكترون') || l.includes('electronic')) && lec.title.includes('إلكترون') ||
              (l.includes('تفكير') || l.includes('scientific')) && lec.title.includes('تفكير')
            )) {
              found = lec;
              break;
            }
          }
          if (found) break;
        }

        if (found) {
          r = `📚 ${found.title}\nالمحاضر: ${found.doctor}\nالمدة: ${found.duration}\n\n${found.summaryAr}\n\n---\nهل تريد النسخة الإنجليزية أو شرحاً إضافياً؟`;
        } else if (l.includes('مرحبا') || l.includes('اهلا') || l.includes('السلام') || l.includes('hello') || l.includes('hi')) {
          r = 'أهلاً وسهلاً! 👋\nأنا هنا لمساعدتك في فهم المحاضرات والإجابة على أسئلتك.\nاسأل عن أي موضوع من موادك.';
        } else if (l.includes('جدول') || l.includes('schedule')) {
          r = selectedGroup
            ? `جدولك الحالي (${selectedGroup}):\nيمكنك مراجعة التفاصيل من قسم "جدول المحاضرات".`
            : 'لم تختر جروبك بعد. اذهب إلى قسم الجدول واختر جروب 1 أو جروب 2.';
        } else if (l.includes('مفضلة') || l.includes('favorite')) {
          r = favorites.length
            ? `المواد المفضلة لديك:\n${favorites.map(c => '• ' + c).join('\n')}`
            : 'لم تضف أي مادة للمفضلة بعد. اضغط على النجمة بجانب أي مادة.';
        } else if (l.includes('تقدم') || l.includes('progress')) {
          r = `تقدمك الدراسي:\nأكملت ${overallProgress.totalDone} من ${overallProgress.totalReady} محاضرة متاحة (${overallProgress.percent}%).\nاستمر! 💪`;
        } else if (l.includes('نصيحة') || l.includes('tip') || l.includes('advice')) {
          r = 'نصائح سريعة:\n1. راجع الملخصات بعد كل محاضرة\n2. استخدم مؤقت الدراسة (بومودورو)\n3. اكتب ملاحظاتك الخاصة\n4. اطلب شرحاً مني لأي جزء غير واضح\n5. حدد المحاضرات كمكتملة لتتبع تقدمك';
        } else {
          r = `تم استلام سؤالك: "${text}"\n\nجرب أن تسأل بشكل أدق عن اسم المحاضرة أو المفهوم (مثل: أنظمة الأعداد، Hardware، التفاضل، قانون أوم...)\n\nأو اكتب "نصيحة" للحصول على نصائح دراسية.`;
        }

        setTimeout(() => {
          setChat(prev => [...prev, { id: Date.now(), sender: 'bot', text: r, time: formatTime() }]);
          setTyping(false);
        }, 700 + Math.random() * 400);
      }, [favorites, selectedGroup, overallProgress]);

      const [voiceListening, setVoiceListening] = useState(false);
      const [voiceSpeaking, setVoiceSpeaking] = useState(false);
      const [pdfBusy, setPdfBusy] = useState(false);
      const recognitionRef = useRef(null);

      const send = async (e, directText = null) => {
        e?.preventDefault();
        const t = String(directText ?? input).trim();
        if (!t || typing) return;
        setInput('');
        setChat(prev => [...prev, { id: Date.now(), sender: 'user', text: t, time: formatTime() }]);
        setTyping(true);
        try {
          if (!supabaseClient) throw new Error('الاتصال بالخادم غير متاح حالياً.');
          let { data: sessionData } = await supabaseClient.auth.getSession();
          if (!sessionData?.session) {
            const { data, error } = await supabaseClient.auth.signInAnonymously();
            if (error) throw new Error('يلزم تفعيل تسجيل الدخول المجهول من إعدادات Supabase أولاً.');
            sessionData = { session: data.session };
          }
          const context = Object.entries(allLecturesData).filter(([code]) => code !== 'default')
            .flatMap(([code, lectures]) => lectures.map(lec =>
              [code, lec.title, lec.doctor, lec.duration, lec.summaryAr, lec.description, lec.content].filter(Boolean).join(' | ')
            )).join('\\n').slice(0, 30000);
          const history = chat.slice(-12).map(m => ({
            role: m.sender === 'bot' ? 'model' : 'user', text: m.text
          }));
          const { data, error } = await supabaseClient.functions.invoke('university-assistant', {
            body: { message: t, history, context }
          });
          if (error) throw error;
          if (data?.error) throw new Error(data.error);
          setChat(prev => [...prev, { id: Date.now() + 1, sender: 'bot', text: data.answer, time: formatTime() }]);
        } catch (err) {
          const message = err?.message || 'تعذر الاتصال بالمساعد حالياً.';
          setChat(prev => [...prev, { id: Date.now() + 1, sender: 'bot', text: message, time: formatTime() }]);
        } finally {
          setTyping(false);
        }
      };

      const analyzePdf = async (file) => {
        if (!file || file.type !== 'application/pdf') return showToast('اختار ملف PDF صحيح', 'error');
        if (!window.pdfjsLib) return showToast('مكتبة PDF غير متاحة. افتح الصفحة بالإنترنت أولاً.', 'error');
        setPdfBusy(true);
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
          let extracted = '';
          for (let pageNo = 1; pageNo <= Math.min(pdf.numPages, 12); pageNo++) {
            const page = await pdf.getPage(pageNo);
            const content = await page.getTextContent();
            extracted += '\n' + content.items.map(item => item.str).join(' ');
            if (extracted.length >= 18000) break;
          }
          extracted = extracted.trim().slice(0, 18000);
          if (!extracted) throw new Error('الملف لا يحتوي على نص قابل للاستخراج. الملفات المصورة تحتاج OCR.');
          send(null, 'حلّل ملف المحاضرة التالي: اكتب ملخصاً منظماً بالعربية، واشرح أهم المفاهيم ببساطة، واستخرج المصطلحات والتعريفات، ثم ضع 5 أسئلة مراجعة مع إجاباتها. اسم الملف: ' + file.name + '\n\n' + extracted);
        } catch (error) {
          showToast(error?.message || 'تعذر قراءة ملف PDF', 'error');
        } finally { setPdfBusy(false); }
      };


      const startVoiceInput = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast('المتصفح لا يدعم الإدخال الصوتي. جرّب Chrome.', 'error');
          return;
        }
        if (recognitionRef.current) recognitionRef.current.stop();
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onstart = () => setVoiceListening(true);
        recognition.onend = () => setVoiceListening(false);
        recognition.onerror = () => { setVoiceListening(false); showToast('تعذر التقاط الصوت. تأكد من إذن الميكروفون.', 'error'); };
        recognition.onresult = (event) => {
          const transcript = event.results?.[0]?.[0]?.transcript?.trim();
          if (transcript) send(null, transcript);
        };
        recognitionRef.current = recognition;
        recognition.start();
      };

      const speakLastAnswer = () => {
        const last = [...chat].reverse().find(m => m.sender === 'bot');
        if (!last || !window.speechSynthesis) {
          showToast('القراءة الصوتية غير مدعومة في هذا المتصفح.', 'error');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(last.text);
        utterance.lang = 'ar-EG';
        utterance.rate = 0.96;
        utterance.onstart = () => setVoiceSpeaking(true);
        utterance.onend = () => setVoiceSpeaking(false);
        utterance.onerror = () => setVoiceSpeaking(false);
        window.speechSynthesis.speak(utterance);
      };

      const explain = (title) => {
        setView('bot');
        setTimeout(() => {
          setChat(prev => [...prev, { id: Date.now(), sender: 'user', text: `أريد شرح: ${title}`, time: formatTime() }]);
          reply(title);
        }, 120);
      };

      const downloadText = (title, content) => {
        const blob = new Blob([`${title}\n\n${content}`], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${title.replace(/[^\w\u0600-\u06FF\s]/g, '').slice(0, 40)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('تم تحميل الملخص بنجاح 📥');
      };

      const deleteNote = (id) => {
        setNotes(prev => prev.filter(n => n.id !== id));
        showToast('تم حذف الملاحظة');
      };

      const calcGPA = () => {
        const gradeMap = { 'A+': 4, 'A': 3.7, 'B+': 3.3, 'B': 3, 'C+': 2.7, 'C': 2.3, 'D': 1.7, 'F': 0 };
        let totalPoints = 0, totalHours = 0;
        gpaCourses.forEach(c => {
          const g = gradeMap[c.grade.toUpperCase()];
          const h = parseFloat(c.hours);
          if (g !== undefined && h > 0) { totalPoints += g * h; totalHours += h; }
        });
        return totalHours ? (totalPoints / totalHours).toFixed(2) : '—';
      };

      const formatTimer = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

      // ==================== VIEWS ====================
      const NavBar = ({ title, onBack, right }) => (
        <div className="sticky top-0 z-40 glass-strong border-b border-sky-200/10 px-4 py-3 flex items-center justify-between safe-top">
          <button onClick={onBack} className="flex items-center gap-1 text-cyan-400 hover:text-cyan-300 font-semibold text-sm">
            <Icons.ChevronRight className="w-5 h-5" /> {title || 'رجوع'}
          </button>
          <div className="flex items-center gap-2">
            <button onClick={cyclePortalTheme} aria-label="تغيير المظهر" title="تغيير مظهر الموقع بالكامل: الألوان والخلفيات والأيقونات والإضاءة"
              className="flex h-9 items-center gap-2 rounded-lg border border-sky-300/25 bg-sky-950/50 px-2.5 text-[11px] font-bold text-sky-100 transition hover:border-sky-300/50">
              <span className="h-3 w-3 rounded-full border border-white/40" style={{ background: portalTheme === 'sky' ? '#38bdf8' : portalTheme === 'burgundy' ? '#9f3658' : portalTheme === 'violet' ? '#a78bfa' : portalTheme === 'emerald' ? '#34d399' : '#fbbf24' }} />
              <span className="home-theme-label">المظهر</span>
            </button>
            {right}
          </div>
        </div>
      );

      const Home = () => (
        <div className="premium-home relative min-h-screen overflow-hidden pb-28">
          <div className="premium-ambient premium-ambient-one" />
          <div className="premium-ambient premium-ambient-two" />
          <div className="premium-container relative z-10 mx-auto max-w-6xl px-4 pt-5 sm:px-6 sm:pt-8">
            <header className="premium-header home-enter flex items-center justify-between gap-3 rounded-2xl px-4 py-3 sm:px-5">
              <div className="flex min-w-0 items-center gap-3">
                <div className="premium-brand-mark flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl">
                  <Icons.Graduation className="h-6 w-6" />
                </div>
                <div className="min-w-0">
                  <p className="home-university-name text-[10px] font-semibold sm:text-[11px]">جامعة بني سويف الأهلية</p>
                  <h1 className="truncate text-base font-black sm:text-lg">بوابتك الجامعية</h1>
                </div>
              </div>
              <div className="flex shrink-0 items-center gap-2">
                <button onClick={cyclePortalTheme} aria-label="تغيير المظهر" title="تغيير مظهر الموقع بالكامل: الألوان والخلفيات والأيقونات والإضاءة" className="premium-icon-button home-theme-toggle">
                  <span className="h-3.5 w-3.5 rounded-full border border-white/40" style={{ background: portalTheme === 'sky' ? '#38bdf8' : portalTheme === 'burgundy' ? '#f09ab7' : portalTheme === 'violet' ? '#b49aff' : portalTheme === 'emerald' ? '#4adea8' : '#ffd166' }} />
                  <span className="home-theme-label">المظهر</span>

              <div className="mb-5 flex h-24 w-24 items-center justify-center rounded-[2rem] border border-sky-300/25 bg-sky-400/10 text-5xl">{selectedProgram === 'cyber' ? '🛡️' : '🩺'}</div>
              <p dir="ltr" className="text-3xl font-black text-sky-200">{programName}</p>
              <h1 className="mt-4 text-xl font-black">البرنامج قيد التجهيز</h1>
              <p className="mt-3 text-sm leading-7 text-slate-400">المحتوى الخاص بالبرنامج ده لسه مضافش. هنضيف المواد والمحاضرات قريبًا.</p>
              <button type="button" onClick={changeStudentProgram} className="mt-8 rounded-xl bg-sky-400 px-7 py-3 text-sm font-black text-slate-950">الرجوع لاختيار البرامج</button>
            </div>
          </div>
        );
      }

      return (
        <>
          {showSplash && (
            <div className="splash-screen fixed inset-0 z-[100] flex min-h-screen flex-col items-center justify-center overflow-hidden px-6 text-center" role="status" aria-label="جاري تحميل بوابتك الجامعية">
              <div className="pointer-events-none absolute left-1/2 top-1/2 h-64 w-64 -translate-x-1/2 -translate-y-1/2 rounded-full border border-cyan-300/20 splash-ring" />
              <div className="splash-mark relative flex flex-col items-center">
                <div className="relative mb-7 flex h-24 w-24 items-center justify-center rounded-[2rem] border border-cyan-200/30 bg-cyan-300/10 text-cyan-200 shadow-[0_0_65px_rgba(6,182,212,0.28)]">
                  <Icons.Graduation className="h-12 w-12" />
                  <div className="absolute -inset-3 rounded-[2.4rem] border border-cyan-300/15" />
                </div>
                <p className="mb-2 text-xs font-bold tracking-[.22em] text-cyan-300">BSNU • UNIVERSITY PORTAL</p>
                <h1 className="text-2xl font-black text-white sm:text-4xl">بوابتك الجامعية</h1>
                <p className="mt-3 text-sm font-semibold text-cyan-100/80 sm:text-base">جامعة بني سويف الأهلية</p>
                <p className="mt-2 text-xs text-slate-400">حاسبات ومعلومات</p>
                <div className="mt-10 h-1 w-40 overflow-hidden rounded-full bg-cyan-950/80">
                  <div className="splash-progress h-full w-full rounded-full bg-gradient-to-l from-sky-300 to-cyan-400" />
                </div>
                <p className="mt-3 text-[10px] text-slate-500">جاري تجهيز بوابتك...</p>
              </div>
            </div>
          )}
          <div dir="rtl" className="portal-root font-cairo min-h-screen soft-page text-gray-200">
          {view === 'home' && <Home />}
          {view === 'subjects' && <Subjects />}
          {view === 'lectures' && <Lectures />}
          {view === 'bot' && BotView()}
          {view === 'groups' && <Groups />}
          {view === 'schedule' && <Schedule />}
          {view === 'notes' && <NotesView />}
          {view === 'timer' && <TimerView />}
          {view === 'gpa' && <GPAView />}
          {view === 'announcements' && <AnnouncementsView />}
          {view === 'tasks' && <TasksView />}
          {view === 'notifications' && <NotificationsView />}
          {view === 'campus-map' && <CampusMapView />}
          {view === 'admin' && (
            <div className="min-h-screen bg-[#061321] px-4 py-8">
              <div className="mx-auto max-w-md">
                <button onClick={() => setView('settings')} className="mb-6 text-sm font-bold text-sky-300">→ العودة للإعدادات</button>
                <div className="glass rounded-3xl border border-sky-300/20 p-6">
                  <div className="mb-5 text-center">
                    <div className="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-sky-400/10 text-sky-300"><Icons.User className="h-7 w-7" /></div>
                    <h1 className="text-xl font-black text-white">لوحة تحكم الأدمن</h1>
                    <p className="mt-1 text-xs text-slate-400">تسجيل دخول آمن عبر Supabase</p>
                  </div>
                  {!supabaseClient ? (
                    <p className="rounded-xl bg-red-500/10 p-3 text-sm text-red-300">خدمة تسجيل الدخول غير متاحة حاليًا.</p>
                  ) : adminChecking ? (
                    <p className="py-6 text-center text-sm text-slate-300">جاري التحقق من الجلسة...</p>
                  ) : adminAllowed && adminSession ? (
                    <div className="space-y-4">
                      <div className="rounded-xl border border-emerald-400/20 bg-emerald-400/10 p-4 text-center">
                        <p className="font-bold text-emerald-300">تم التحقق من صلاحيات الأدمن</p>
                        <p className="mt-1 break-all text-xs text-slate-300">{adminSession.user?.email}</p>
                      </div>
                      <section className="mb-4 space-y-3">
                        <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                          {[['ملفات الطلاب المسجلين',adminOverview.students],['التكليفات',adminOverview.tasks]].map(([label,value])=><div key={label} className="rounded-xl border border-sky-300/15 bg-sky-400/5 p-3"><div className="text-[10px] text-slate-400">{label}</div><div className="mt-1 text-xl font-black text-sky-200">{value}</div></div>)}
                        </div>
                        <div className="rounded-xl border border-sky-300/15 bg-slate-950/30 p-3">
                          <div className="mb-2 flex items-center justify-between"><b className="text-xs text-white">سجل النشاط الإداري</b><button type="button" onClick={loadAdminOverview} className="text-[10px] text-sky-300">تحديث</button></div>
                          {adminOverview.topLectures.length ? <div className="mb-3 border-b border-white/5 pb-3">{adminOverview.topLectures.map((item,index)=><div key={index} className="flex items-center justify-between gap-2 py-1.5 text-[10px]"><span className="truncate text-slate-300">{item.title} {item.subject ? '• '+item.subject : ''}</span><b className="text-sky-200">{item.count} مشاهدة</b></div>)}</div> : <p className="mb-2 text-[10px] text-slate-500">ستظهر أكثر المحاضرات مشاهدة بعد تفاعل الطلاب معها.</p>}
                          {adminOverview.activity.length ? adminOverview.activity.map(item=><div key={item.id} className="flex items-center justify-between gap-2 border-t border-white/5 py-2 text-[10px]"><span className="text-slate-300">{item.action === 'create' ? 'إضافة' : item.action === 'update' ? 'تعديل' : 'حذف'} • {item.entity}</span><span className="text-slate-500">{new Date(item.created_at).toLocaleString('ar-EG')}</span></div>) : <p className="text-[10px] text-slate-500">لا توجد عمليات مسجلة بعد.</p>}
                        </div>
                      </section>
                      <div className="space-y-4 text-right">
                        <div>
                          <label className="mb-2 block text-xs font-bold text-slate-300">اختار القسم اللي عايز تديره</label>
                          <select value={adminSelectedTable} onChange={e => { setAdminSelectedTable(e.target.value); setAdminEditingId(null); }} className="w-full rounded-xl border border-sky-300/20 bg-slate-900 px-3 py-3 text-sm text-white">
                            {adminTableOptions.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}
                          </select>
                        </div>
                        <form onSubmit={saveAdminRecord} className="space-y-3 rounded-2xl border border-sky-300/20 bg-sky-400/5 p-3">
                          <div className="flex items-center justify-between gap-2">
                            <h3 className="text-sm font-extrabold text-white">{adminEditingId !== null ? 'تعديل البيانات' : 'إضافة سجل جديد'}</h3>
                            {adminEditingId !== null && <button type="button" onClick={() => { setAdminEditingId(null); setAdminFormData({}); }} className="text-xs text-slate-300 underline">إلغاء التعديل</button>}
                          </div>
                          <p className="text-[11px] leading-5 text-slate-400">املأ الخانات التالية، وسيتم حفظ البيانات مباشرة في قاعدة البيانات.</p>
                          {adminEditingId === null && [].includes(adminSelectedTable) && <p className="rounded-lg bg-amber-400/10 p-2 text-[10px] leading-5 text-amber-200">هذا القسم يُنشأ تلقائيًا من تفاعل الطلاب. اختار سجلًا من القائمة لتعديله أو مراجعته.</p>}
                          <div className="grid grid-cols-1 gap-3">
                            {adminFieldConfig[adminSelectedTable].map(field => (
                              <label key={field.key} className="block text-xs font-bold text-slate-300">
                                <span className="mb-1.5 block">{field.label}{field.required ? ' *' : ''}</span>
                                {field.type === 'subject' ? (
                                  <select value={adminFormData[field.key] ?? ''} onChange={e => setAdminFormData(current => ({ ...current, [field.key]: e.target.value, doctor: field.key === 'subject_code' ? '' : current.doctor }))} required={!!field.required} className="soft-control w-full rounded-xl px-3 py-3 text-sm text-white">
                                    <option value="">اختار المادة</option>
                                    {subjectsData.map(subject => <option key={subject.code} value={subject.code}>{subject.arabicName || subject.name}</option>)}
                                  </select>
                                ) : field.type === 'instructor' ? (
                                  <select value={adminFormData[field.key] ?? ''} onChange={e => setAdminFormData(current => ({ ...current, [field.key]: e.target.value }))} required={!!field.required} disabled={!adminFormData.subject_code} className="soft-control w-full rounded-xl px-3 py-3 text-sm text-white">
                                    <option value="">اختار الدكتور</option>
                                    {(instructorsBySubject[adminFormData.subject_code] || []).map(instructor => (
                                      <option key={instructor.name} value={instructor.name}>{instructor.name}{instructor.note ? ' — ' + instructor.note : ''}</option>
                                    ))}
                                  </select>
                                ) : field.type === 'textarea' ? (
                                  <textarea value={adminFormData[field.key] ?? ''} onChange={e => setAdminFormData(current => ({ ...current, [field.key]: e.target.value }))} rows={3} required={!!field.required} className="soft-control w-full rounded-xl px-3 py-2.5 text-sm text-white" />
                                ) : field.type === 'boolean' ? (
                                  <select value={adminFormData[field.key] ?? ''} onChange={e => setAdminFormData(current => ({ ...current, [field.key]: e.target.value }))} className="soft-control w-full rounded-xl px-3 py-3 text-sm text-white">
                                    <option value="">اختار الحالة</option>
                                    <option value="true">نعم</option>
                                    <option value="false">لا</option>
                                  </select>
                                ) : ['taskkind','notificationkind','reportstatus'].includes(field.type) ? (
                                  <select value={adminFormData[field.key] ?? ''} onChange={e => setAdminFormData(current => ({ ...current, [field.key]: e.target.value }))} required={!!field.required} className="soft-control w-full rounded-xl px-3 py-3 text-sm text-white">
                                    {(field.type === 'taskkind' ? [['assignment','تكليف'],['exam','امتحان']] : field.type === 'reportstatus' ? [['open','مفتوح'],['reviewed','تمت المراجعة'],['dismissed','مرفوض']] : [['info','معلومات'],['warning','تحذير'],['success','نجاح'],['exam','امتحان'],['schedule','جدول']]).map(([value,label]) => <option key={value} value={value}>{label}</option>)}
                                  </select>
                                ) : (
                                  <input type={field.type === 'number' ? 'number' : field.type === 'url' ? 'url' : field.type === 'datetime-local' ? 'datetime-local' : 'text'} value={adminFormData[field.key] ?? ''} onChange={e => setAdminFormData(current => ({ ...current, [field.key]: e.target.value }))} required={!!field.required} disabled={field.type === 'readonly'} placeholder={field.type === 'url' ? 'https://...' : ''} className="soft-control w-full rounded-xl px-3 py-3 text-sm text-white" dir={field.key.includes('url') || field.key.includes('code') ? 'ltr' : 'auto'} />
                                )}
                              </label>
                            ))}
                          </div>
                          <button disabled={adminDataBusy || (adminEditingId === null && ['student_profiles'].includes(adminSelectedTable))} type="submit" className="w-full rounded-xl bg-sky-500 py-3 text-sm font-black text-slate-950 disabled:opacity-50">{adminDataBusy ? 'جاري الحفظ...' : adminEditingId !== null ? 'حفظ التعديلات' : 'إضافة إلى قاعدة البيانات'}</button>
                        </form>
                        <div className="flex items-center justify-between">
                          <div><h3 className="text-sm font-extrabold text-white">{adminSelectedTable === 'lectures' ? 'المحاضرات حسب المادة' : 'السجلات الحالية'} ({adminRecords.length})</h3>{adminSelectedTable === 'lectures' && <p className="mt-1 text-[10px] text-slate-400">افتح أي مادة لعرض محاضراتها وتعديلها أو حذفها</p>}</div>
                          <button onClick={() => loadAdminRecords()} disabled={adminDataBusy} className="text-xs font-bold text-sky-300 underline">تحديث</button>
                        </div>
                        {adminDataBusy && adminRecords.length === 0 ? <p className="py-5 text-center text-xs text-slate-400">جاري تحميل البيانات...</p> : adminRecords.length === 0 ? <p className="rounded-xl border border-slate-700 p-4 text-center text-xs text-slate-400">مفيش سجلات في القسم ده حاليًا.</p> : (
                          <div className="max-h-[460px] space-y-2 overflow-y-auto">
                            {adminSelectedTable === 'lectures' ? (
                              Object.entries(adminRecords.reduce((groups, record) => {
                                const code = record.subject_code || 'بدون مادة';
                                (groups[code] ||= []).push(record);
                                return groups;
                              }, {})).map(([code, records]) => {
                                const subject = subjectsData.find(item => item.code === code);
                                const SubjectIcon = Icons[subject?.icon] || Icons.BookOpen;
                                return (
                                  <details key={code} className="overflow-hidden rounded-xl border border-sky-300/20 bg-slate-900/80">
                                    <summary className="flex cursor-pointer list-none items-center justify-between gap-3 p-3">
                                      <span className="flex min-w-0 items-center gap-3">
                                        <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-sky-400/10 text-sky-300"><SubjectIcon className="h-5 w-5" /></span>
                                        <span className="min-w-0">
                                          <span className="block truncate text-sm font-extrabold text-white">{subject?.arabicName || code}</span>
                                          <span className="mt-1 block text-[10px] text-slate-400">{code} • {records.length} محاضرة</span>
                                        </span>
                                      </span>
                                      <Icons.ChevronDown className="h-4 w-4 shrink-0 text-sky-300" />
                                    </summary>
                                    <div className="space-y-2 border-t border-slate-700 p-3">
                                      {records.map((record, index) => (
                                        <div key={record.id ?? index} className="rounded-lg border border-slate-700 bg-slate-950/60 p-3">
                                          <p className="text-sm font-bold leading-6 text-white">{record.title || 'محاضرة بدون عنوان'}</p>
                                          <div className="mt-1 flex flex-wrap gap-x-3 gap-y-1 text-[10px] text-slate-400">
                                            {record.doctor && <span>{record.doctor}</span>}
                                            {record.duration && <span>{record.duration}</span>}
                                          </div>
                                          <div className="mt-3 flex gap-2">
                                            <button onClick={() => editAdminRecord(record)} className="flex-1 rounded-lg bg-sky-400/10 py-2 text-xs font-bold text-sky-200">تعديل</button>
                                            <button onClick={() => deleteAdminRecord(record)} disabled={adminDataBusy} className="flex-1 rounded-lg bg-red-400/10 py-2 text-xs font-bold text-red-200 disabled:opacity-50">حذف</button>
                                          </div>
                                        </div>
                                      ))}
                                    </div>
                                  </details>
                                );
                              })
                            ) : adminRecords.map((record, index) => (
                              <div key={record.id ?? index} className="rounded-xl border border-slate-700 bg-slate-900/80 p-3">
                                <pre dir="ltr" className="max-h-32 overflow-auto whitespace-pre-wrap break-words text-left text-[10px] leading-5 text-slate-300">{JSON.stringify(record, null, 2)}</pre>
                                <div className="mt-3 flex gap-2">
                                  <button onClick={() => editAdminRecord(record)} className="flex-1 rounded-lg bg-sky-400/10 py-2 text-xs font-bold text-sky-200">تعديل</button>
                                  <button onClick={() => deleteAdminRecord(record)} disabled={adminDataBusy} className="flex-1 rounded-lg bg-red-400/10 py-2 text-xs font-bold text-red-200 disabled:opacity-50">حذف</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                      <button disabled={adminBusy} onClick={handleAdminLogout} className="w-full rounded-xl bg-slate-700 py-3 text-sm font-bold text-white disabled:opacity-50">{adminBusy ? 'جاري تسجيل الخروج...' : 'تسجيل الخروج'}</button>
                    </div>
                  ) : (
                    <form onSubmit={handleAdminLogin} className="space-y-3">
                      <label className="block text-xs font-bold text-slate-300">البريد الإلكتروني</label>
                      <input type="email" required autoComplete="username" value={adminEmail} onChange={e => setAdminEmail(e.target.value)} placeholder="admin@example.com" className="soft-control w-full rounded-xl px-4 py-3 text-sm text-white" dir="ltr" />
                      <label className="block text-xs font-bold text-slate-300">كلمة المرور</label>
                      <input type="password" required autoComplete="current-password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="••••••••" className="soft-control w-full rounded-xl px-4 py-3 text-sm text-white" dir="ltr" />
                      <button type="submit" disabled={adminBusy} className="mt-2 w-full rounded-xl bg-sky-500 py-3 text-sm font-black text-slate-950 disabled:opacity-50">{adminBusy ? 'جاري التحقق...' : 'تسجيل الدخول'}</button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          )}
                    {view === 'settings' && <SettingsView />}
          {view === 'tools' && <ToolsView />}
          <footer className="developer-footer relative z-10 mx-auto mt-3 w-full max-w-6xl px-4 pb-32 pt-0 sm:px-6" aria-label="معلومات المطور">
            <div className="overflow-hidden rounded-2xl border border-sky-300/15 bg-slate-950/35 px-5 py-5 text-center">
              <div className="mx-auto mb-3 h-px w-16 bg-gradient-to-r from-transparent via-sky-300/70 to-transparent" />
              <p className="text-[10px] font-bold tracking-[.18em] text-sky-300/75">DESIGNED & DEVELOPED BY</p>
              <p className="mt-1 text-lg font-black text-white">Ahmed Osama</p>
              <div className="mt-4 flex items-center justify-center gap-3" dir="ltr">
                <a href="https://www.facebook.com/ahmed.osama.185953?mibextid=ZbWKwL" target="_blank" rel="noopener noreferrer" aria-label="Facebook"
                  className="developer-social-link" title="Facebook"><Icons.Facebook className="h-5 w-5" /></a>
                <a href="https://www.instagram.com/a7med_osama_2008y?srtk=MWR3ZWd4NmVqOW5q" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
                  className="developer-social-link" title="Instagram"><Icons.Instagram className="h-5 w-5" /></a>
                <a href="https://wa.me/201119136553" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"
                  className="developer-social-link" title="WhatsApp"><Icons.WhatsApp className="h-5 w-5" /></a>
              </div>
              <p className="mt-4 text-[10px] text-slate-500">© 2026 • بوابة جامعة بني سويف الأهلية</p>
              <p className="mt-2 text-[10px] font-bold text-sky-300/75">إصدار 2026 • للاستخدام التعليمي</p>
            </div>
          </footer>
          <SearchOverlay />
          <BottomNav />

          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl shadow-lg font-semibold text-sm flex items-center gap-2 animate-slide-up ${
              toast.type === 'error' ? 'bg-cyan-700 text-white' : 'bg-green-600 text-white'
            }`}>
              <Icons.CheckCircle className="w-4 h-4" /> {toast.msg || toast}
            </div>
          )}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

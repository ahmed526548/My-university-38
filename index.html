          externalLinks: [
            { label: 'عرض الملخص داخل الموقع', url: 'https://raw.githubusercontent.com/ahmed526548/My-university-38/main/lectures/Electronics/Electronics-Section-4-Summary.md', content: "# Electronics – Section 4\n## ملخص وشرح المحاضرة\n\n### 1) المقاومة الكهربائية (Resistance)\nالمقاومة خاصية المادة التي تعارض مرور التيار الكهربائي، ورمزها R ووحدتها الأوم (Ω).\n\nمقاومة مادة منتظمة المقطع:\n`R = ρℓ/A`\n\n- ρ: المقاومية النوعية (Ω·m)\n- ℓ: الطول (m)\n- A: مساحة المقطع (m²)\n\nزيادة طول المادة تزيد مقاومتها، وزيادة مساحة المقطع تقلل مقاومتها.\n\n### 2) قانون أوم (Ohm’s Law)\n`V = IR`\nومنها: `I = V/R` و `R = V/I`.\n\nمثال: مقاومة 4 Ω موصلة بجهد 12 V:\n`I = 12/4 = 3 A`.\n\n### 3) اتفاقية الإشارة (Passive Sign Convention)\nإذا دخل التيار إلى الطرف الموجب للمقاومة وخرج من الطرف السالب: `V = IR`.\nإذا كانت مراجع اتجاه التيار وقطبية الجهد متعاكسة وفق تعريف المسألة: `V = -IR`.\nحدد الاتجاه والقطبية أولًا والتزم بهما.\n\n### 4) أنواع المقاومات\n- Fixed Resistor: مقاومة ثابتة.\n- Variable Resistor: مقاومة يمكن تغيير قيمتها.\n\n### 5) التوصيلية (Conductance)\nمقلوب المقاومة، ورمزها G:\n`G = 1/R`\nوحدتها السيمنز (S)، ويُستخدم أيضًا mho.\n\nمثال: إذا كانت R = 5 Ω فإن G = 0.2 S.\n\n### 6) العقد والفروع والحلقات\n- Node: نقطة اتصال فرعين أو أكثر.\n- Branch: جزء يحتوي عنصرًا واحدًا مثل مقاومة أو مصدر جهد.\n- Loop: مسار مغلق يبدأ وينتهي عند النقطة نفسها.\n\n### 7) التوالي والتوازي\n**التوالي (Series):** التيار نفسه يمر في العناصر:\n`Req = R1 + R2 + ...`\n\n**التوازي (Parallel):** الجهد نفسه على العناصر:\n`1/Req = 1/R1 + 1/R2 + ...`\nولمقاومتين:\n`Req = (R1 × R2)/(R1 + R2)`\n\nمثال: 2 Ω و3 Ω:\n- توالي: 5 Ω\n- توازي: 1.2 Ω\n\n### 8) قانون كيرشوف للتيار (KCL)\nمجموع التيارات الداخلة إلى أي عقدة يساوي مجموع التيارات الخارجة:\n`ΣI(in) = ΣI(out)`.\n\n### 9) قانون كيرشوف للجهد (KVL)\nالمجموع الجبري لفروق الجهد حول أي مسار مغلق يساوي صفرًا:\n`ΣV = 0`.\n\n### خطوات حل مسائل الدوائر\n1. اقرأ الرسم وحدد العناصر والقيم واتجاهات التيار وقطبية الجهد.\n2. استخدم قانون أوم عند الحاجة.\n3. استخدم KCL لحساب التيارات عند العقد.\n4. استخدم KVL لحساب الجهود حول الحلقات.\n5. التزم باتفاقية الإشارات.\n6. راجع الوحدات: V للجهد، A للتيار، Ω للمقاومة، وS للتوصيلية.\n\n### ورقة القوانين السريعة\n- `V = IR`\n- `I = V/R`\n- `R = V/I`\n- `R = ρℓ/A`\n- `G = 1/R`\n- `Req(series) = R1 + R2 + ...`\n- `Req(parallel) = (R1R2)/(R1+R2)` لمقاومتين\n- `ΣI(in) = ΣI(out)`\n- `ΣV = 0`\n\n> ملاحظة: هذا ملف نصي مستخرج ومنسق من ملف الشرح المرفوع، وليس نسخة DOCX الأصلية.\n" },
            { label: 'عرض نص الشرائح داخل الموقع', url: 'https://raw.githubusercontent.com/ahmed526548/My-university-38/main/lectures/Electronics/Electronics-Section-4-Slides-Text-Extract.md', content: "# Electronics – Section 4 (Lecture Slides: extracted text)\n**TA: SALMA SAEED**\n\n## Topics covered\n- Ohm’s Law\n- Resistance and resistivity\n- Passive sign convention\n- Fixed and variable resistors\n- Conductance\n- Nodes, branches, and loops\n- Series and parallel connections\n- Kirchhoff’s Current Law (KCL)\n- Kirchhoff’s Voltage Law (KVL)\n- Worked examples\n- Assignment 2 and Assignment 3\n\n## Extracted lecture text\n\n### Ohm’s Law\nMaterials resist the flow of electric charge. This property is called resistance and is represented by R. The resistance of a uniform material depends on its cross-sectional area A, length ℓ, and resistivity ρ. Copper and aluminum have low resistivity; mica and paper have high resistivity.\n\nThe circuit element used to model resistance is the resistor.\n\n### Passive sign convention\nThe current direction and voltage polarity must follow the passive sign convention:\n- If current flows from higher potential to lower potential: v = iR.\n- If current flows from lower potential to higher potential: v = −iR.\n\n### Resistors\nA resistor may be fixed or variable. Most resistors are fixed, meaning their resistance remains constant.\n\n### Conductance\nConductance G is the reciprocal of resistance and measures how well an element conducts electric current. Units include mho (℧) and siemens (S).\n\n### Nodes, branches, and loops\n- A branch represents a single element such as a voltage source or resistor.\n- A node is the connection point between two or more branches.\n- A loop is any closed path in a circuit.\n- Series elements share a single node and carry the same current.\n- Parallel elements connect to the same two nodes and have the same voltage.\n\n### Kirchhoff’s laws\nThe slides include sections on Kirchhoff’s Current Law and Kirchhoff’s Voltage Law, followed by worked examples.\n\n### Assignments\nThe presentation includes Assignment 2 (Problems 1–4) and Assignment 3 (Problems 5–6).\n\nAssignment form: https://forms.gle/V3FFcc421KS3ZTtk8\n\n> Important: This is the text extract of the PowerPoint. Diagrams, circuit images, and some numerical details from slide images are not represented here. The original PPTX binary could not be transferred from the available file workspace.\n" }

      const getProgress = (code) => {

        const ready = lec.filter(l => l.hasContent).length;
        const done = lec.filter(l => isCompleted(code, l.id)).length;
        return { total: lec.length, ready, done, percent: Math.round((ready / lec.length) * 100), donePercent: Math.round((done / Math.max(ready, 1)) * 100) };

      const overallProgress = useMemo(() => {
        let totalReady = 0, totalDone = 0;

      const currentSchedule = selectedGroup === 'جروب 2' ? scheduleGroup2 : scheduleGroup1;

        const l = text.toLowerCase();
        let r = '';

        // Search in all lecture content
        let found = null;
        for (const [code, lecs] of Object.entries(allLecturesData)) {
          if (code === 'default') continue;
          for (const lec of lecs) {
            if (lec.hasContent && (lec.title.includes(text) || lec.summaryAr.includes(text) || lec.summaryEn.toLowerCase().includes(l) ||
              (l.includes('أنظمة') && lec.title.includes('Number')) ||
              (l.includes('hardware') || l.includes('هاردوير') || l.includes('مكونات')) && lec.title.includes('Hardware') ||
              (l.includes('software') || l.includes('برمج')) && lec.title.includes('Software') ||
              (l.includes('شبكة') || l.includes('network')) && lec.title.includes('Network') ||
              (l.includes('أمن') || l.includes('security')) && lec.title.includes('Security') ||
              (l.includes('تفاضل') || l.includes('derivative')) && lec.title.includes('تفاضل') ||
              (l.includes('إلكترون') || l.includes('electronic')) && lec.title.includes('إلكترون') ||
              (l.includes('تفكير') || l.includes('scientific')) && lec.title.includes('تفكير')
            )) {
              found = lec;
              break;
            }
          }
          if (found) break;
        }

        if (found) {
          r = `📚 ${found.title}\nالمحاضر: ${found.doctor}\nالمدة: ${found.duration}\n\n${found.summaryAr}\n\n---\nهل تريد النسخة الإنجليزية أو شرحاً إضافياً؟`;

          r = `تقدمك الدراسي:\nأكملت ${overallProgress.totalDone} من ${overallProgress.totalReady} محاضرة متاحة (${overallProgress.percent}%).\nاستمر! 💪`;

        } else {

          setChat(prev => [...prev, { id: Date.now(), sender: 'bot', text: r, time: formatTime() }]);

              <h3 className="font-bold text-white text-sm mb-3">البيانات المحفوظة</h3>
              <div className="space-y-2 text-xs text-gray-400">
                <div className="flex justify-between"><span>المفضلة</span><span className="text-cyan-400">{favorites.length}</span></div>
                <div className="flex justify-between"><span>محاضرات مكتملة</span><span className="text-cyan-400">{Object.keys(completed).length}</span></div>
                <div className="flex justify-between"><span>ملاحظات</span><span className="text-cyan-400">{notes.length}</span></div>
                <div className="flex justify-between"><span>الجروب</span><span className="text-cyan-400">{selectedGroup || '—'}</span></div>
              </div>
            </div>
            <button onClick={() => {
              if (confirm('هل أنت متأكد من مسح كل البيانات المحلية؟')) {
                localStorage.clear();
                setFavorites([]); setCompleted({}); setNotes([]); setSelectedGroup(null);
                showToast('تم مسح جميع البيانات');
              }
            }} className="w-full glass border border-cyan-900/40 text-cyan-400 py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
              <Icons.Trash className="w-4 h-4" /> مسح كل البيانات المحلية
            </button>
            <div className="glass border border-cyan-900/30 rounded-2xl p-4 text-center">
              <Icons.Graduation className="w-8 h-8 text-cyan-500 mx-auto mb-2" />
              <p className="text-white font-bold text-sm">بوابة جامعة بني سويف الأهلية</p>
              <p className="text-gray-500 text-xs mt-1">إصدار محسّن 2026 • للاستخدام التعليمي</p>
            </div>
          </div>
        </div>
      );

      // Global Search Overlay
      const SearchOverlay = () => showSearch && (
        <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md animate-fade-in flex flex-col">
          <div className="p-4 flex items-center gap-3">
            <button onClick={() => { setShowSearch(false); setGlobalSearch(''); }} className="text-gray-400"><Icons.X className="w-6 h-6" /></button>
            <input autoFocus value={globalSearch} onChange={e => setGlobalSearch(e.target.value)} placeholder="ابحث في كل المحاضرات..."
              className="flex-1 bg-[#091923] border border-cyan-900/50 text-white rounded-xl py-3 px-4 text-sm focus:outline-none focus:border-cyan-500" />
          </div>
          <div className="flex-1 overflow-y-auto px-4 pb-8">
            {globalSearch && searchResults.length === 0 && <p className="text-center text-gray-600 mt-10 text-sm">لا توجد نتائج</p>}
            {searchResults.map((r, i) => (
              <button key={i} onClick={() => {
                setShowSearch(false); setGlobalSearch('');
                setSelectedSubject(r.subject); setView('lectures');
                setTimeout(() => setPreview({ open: true, title: r.lecture.title, content: r.lecture.summaryAr, lang: 'ar', lecture: r.lecture }), 200);
              }} className="w-full text-right glass border border-cyan-900/30 rounded-xl p-3 mb-2 hover:border-cyan-500/40 transition">
                <div className="text-xs text-cyan-400 mb-0.5">{r.subject.arabicName}</div>
                <div className="text-sm text-white font-medium">{r.lecture.title}</div>
              </button>
            ))}
          </div>
        </div>
      );

      // Bottom Nav (mobile)
      const BottomNav = () => view !== 'home' ? null : (
        <div className="fixed bottom-0 inset-x-0 z-30 glass-strong border-t border-cyan-900/40 safe-bottom">
          <div className="flex justify-around py-2 max-w-lg mx-auto">
            {[
              { icon: Icons.Home, label: 'الرئيسية', v: 'home' },
              { icon: Icons.BookOpen, label: 'المواد', v: 'subjects' },
              { icon: Icons.Bot, label: 'المساعد', v: 'bot' },
              { icon: Icons.Calendar, label: 'الجدول', v: selectedGroup ? 'schedule' : 'groups' },
            ].map(({ icon: I, label, v }) => (
              <button key={v} onClick={() => setView(v)} className={`nav-action flex flex-col items-center gap-0.5 rounded-xl px-3 py-1 ${view === v ? 'text-cyan-400' : 'text-gray-500'}`}>
                <I className="w-5 h-5" />
                <span className="text-[10px] font-medium">{label}</span>
              </button>
            ))}
          </div>
        </div>
      );

      return (
        <div dir="rtl" className="font-cairo min-h-screen bg-[#030c13] text-gray-200">
          {view === 'home' && <Home />}
          {view === 'subjects' && <Subjects />}
          {view === 'lectures' && <Lectures />}
          {view === 'bot' && <BotView />}
          {view === 'groups' && <Groups />}
          {view === 'schedule' && <Schedule />}
          {view === 'notes' && <NotesView />}
          {view === 'timer' && <TimerView />}
          {view === 'gpa' && <GPAView />}
          {view === 'announcements' && <AnnouncementsView />}
          {view === 'settings' && <SettingsView />}
          <SearchOverlay />
          <BottomNav />

          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl shadow-lg font-semibold text-sm flex items-center gap-2 animate-slide-up ${
              toast.type === 'error' ? 'bg-cyan-700 text-white' : 'bg-green-600 text-white'
            }`}>
              <Icons.CheckCircle className="w-4 h-4" /> {toast.msg || toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
